	<dialog class="source-modal" aria-labelledby="source-modal-title">

		</nav>
	</dialog>

	<script>
		const sourceModal = document.querySelector(".source-modal");

		document.querySelectorAll(".model-trigger").forEach((model) => {
			model.addEventListener("click", () => sourceModal.showModal());
		});

		document.querySelector(".source-modal-close").addEventListener("click", () => sourceModal.close());
		document.addEventListener("keydown", (event) => {
			if (event.key === "Escape" && sourceModal.open) sourceModal.close();
		});
		sourceModal.addEventListener("click", (event) => {
			if (event.target === sourceModal) sourceModal.close();
		});
		sourceModal.querySelectorAll("a").forEach((link) => {
			link.addEventListener("click", (event) => event.preventDefault());
		});
	</script>
