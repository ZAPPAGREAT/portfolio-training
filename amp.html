					<ul class="model-list">
						<li><button class="model-trigger" type="button">JC-120</button></li>
						<li><button class="model-trigger" type="button">JC-22</button></li>
						<li><button class="model-trigger" type="button">Blues Cube Hot</button></li>
						<li><button class="model-trigger" type="button">Blues Cube Artist 212</button></li>
						<li><button class="model-trigger" type="button">CUBE-10GX</button></li>
						<li><button class="model-trigger" type="button">CUBE Streea EX</button></li>
						<li><button class="model-trigger" type="button">CUBE Street MINI</button></li>

	<dialog class="source-modal" aria-labelledby="source-modal-title">
		<button class="source-modal-close" type="button" aria-label="閉じる">×</button>
		<h2 id="source-modal-title">どこから見ますか？</h2>
		<nav class="source-links" aria-label="販売サイト">
			<a href="#">公式サイトから</a>
			<a href="#">ワクワク楽器から</a>
			<a href="#">マユツバ楽器から</a>
		</nav>
	</dialog>

	<script>
		const sourceModal = document.querySelector(".source-modal");

		document.querySelectorAll(".model-trigger").forEach((model) => {
			model.addEventListener("click", () => sourceModal.showModal());
		});

		document.querySelector(".source-modal-close").addEventListener("click", () => sourceModal.close());
		document.addEventListener("keydown", (event) => {
			if (event.key === "Escape" && sourceModal.open) sourceModal.close();
		});
		sourceModal.addEventListener("click", (event) => {
			if (event.target === sourceModal) sourceModal.close();
		});
		sourceModal.querySelectorAll("a").forEach((link) => {
			link.addEventListener("click", (event) => event.preventDefault());
		});
	</script>
</body>
</html>
